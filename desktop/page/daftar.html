      right: 24px;

      height: 22px;
      cursor: pointer;
      transition: opacity 0.3s ease;
    }
    
    .input-icon-right:hover {

<body>
  <main class="main-container">
    <div class="content-wrapper">
      <section class="hero-section">
        <div class="hero-content">
          <h1 class="hero-title">
            Selamat Datang <br>di <span class="hero-title-highlight">Ruangguru</span>
          </h1>
          <img src="../assets/images/img_welcome_cuate.svg" alt="Welcome illustration showing people celebrating with a welcome banner" class="hero-image">
        </div>
      </section>
      
      <section class="form-section">
        <div class="form-container">
          <h2 class="form-title">Daftar Akun</h2>
          
          <form class="form-fields">
            <div class="form-group">
              <label for="username" class="form-label">Nama Pengguna</label>
              <div class="input-wrapper">
                <img src="../assets/images/img_vector.svg" alt="" class="input-icon-left">
                <input 
                  type="text" 
                  id="username" 
                  class="input-field" 
                  placeholder="Masukkan teks"
                  aria-label="Nama Pengguna"
                >
              </div>
            </div>
            
            <div class="form-group">
              <label for="email" class="form-label">Email</label>
              <div class="input-wrapper">
                <img src="../assets/images/img_vector_gray_900.svg" alt="" class="input-icon-left">
                <input 
                  type="email" 
                  id="email" 
                  class="input-field" 
                  placeholder="Masukkan teks"
                  aria-label="Email"
                >
              </div>
            </div>
            
            <div class="form-group">
              <label for="password" class="form-label">Kata Sandi</label>
              <div class="input-wrapper">
                <img src="../assets/images/img_vector_gray_900_22x20.svg" alt="" class="input-icon-left">
                <input 
                  type="password" 
                  id="password" 
                  class="input-field" 
                  placeholder="Masukkan teks"
                  aria-label="Kata Sandi"
                >
                <img 
                  src="../assets/images/img_iconoireyesolid.svg" 
                  alt="Toggle password visibility" 
                  class="input-icon-right"
                  onclick="togglePassword()"
                  role="button"
                  tabindex="0"
                >
              </div>
            </div>
            
            <div class="button-group">
              <button type="submit" class="btn-primary">Daftar</button>
              <button type="button" class="btn-google">
                <img src="../assets/images/img_rigooglefill.svg" alt="Google icon" class="google-icon">
                Sign up dengan Google
              </button>
              
              <div class="signin-link">
                <span class="signin-text">Sudah memiliki akun?</span>
                <a href="login.html" class="signin-link-text">Masuk</a>
              </div>
            </div>
          </form>
        </div>
      </section>
    </div>
  </main>
  
  <script>
    function togglePassword() {
      const passwordInput = document.getElementById('password');
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
    }

    // Handle form submission → navigate to home page
    document.querySelector('form').addEventListener('submit', function(e) {
      e.preventDefault();
      window.location.href = '../index.html';
    });
  </script>
